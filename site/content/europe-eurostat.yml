blocks:
  - type: profile
    id: profile-eurostat
    name: Eurostat migration and asylum statistics
    summary: Every country reports the same tables under an EU regulation. They are counts, not records of individual people.
    rows:
      - ["What it is", "Official tables on migrant residents, permits, asylum, naturalisations and returns."]
      - ["Who produces it", "Eurostat, with data from national statistical offices and interior ministries."]
      - ["Unit", "Counts of people, permits, applications and decisions."]
      - ["Coverage", "The EU, Iceland, Liechtenstein, Norway and Switzerland. The UK until 2019. Every country of origin."]
      - ["How often", "Every year. Asylum data come out every month."]
      - ["Migration variables", "Country of birth or citizenship, reason for the permit, asylum decision and type of return."]
      - ["Best for", "How many LAC migrants live in each country, and through which legal door they arrive."]
      - ["What we have built with it", "Profiles of LAC diasporas in Europe, with a focus on Mexico. Return statistics for Central America."]
      - ["Access", "Free and open. Cite Eurostat."]
  - type: profile
    id: profile-ime
    name: Mexican consular records
    summary: Mexico registers its nationals abroad at its consulates. The records cover places where surveys are thin.
    rows:
      - ["What it is", "Yearly fact sheets on Mexicans registered at consulates."]
      - ["Who produces it", "Institute for Mexicans Abroad, Government of Mexico."]
      - ["Coverage", "159 countries in 2025. A series for 11 countries since 2018."]
      - ["Migration variables", "Sex, age, occupation, state of origin in Mexico and nationality held."]
      - ["Best for", "Mexicans outside the US."]
      - ["Be careful", "Some years repeat the figures of the year before."]
  - type: chart
    id: eu_lac_born_2024
  - type: chart
    id: eu_first_permits_reason
  - type: chart
    id: eu_asylum_first_time
  - type: text
    id: questions
    heading: Questions it answers
    bullets:
      - How many people born in each LAC country live in each European country.
      - "Through which door they arrive: family, study, work or protection."
      - How many ask for asylum each month, and how their cases end.
      - How many become citizens.
  - type: callouts
    id: traps
    heading: Be careful with
    items:
      - {title: "Birth or citizenship", text: "Counts by citizenship drop people who naturalize. Use country of birth to size a diaspora."}
      - {title: "A permit is not a person", text: "One person can hold several permits over time. Naturalized citizens hold none."}
      - {title: "Countries come and go", text: "More countries report each year. Compare the same set of countries over time."}
      - {title: "Gaps", text: "France and Germany do not report residents by country of birth. The UK stops in 2019."}
  - type: links
    heading: Pairs well with
    items:
      - {text: "03 Household surveys", href: household-surveys.html, note: "Spain's survey adds work and income for LAC-born residents."}
      - {text: "04 Global estimates", href: global-estimates.html, note: "UN and modelled estimates fill the gaps for France and Germany."}
      - {text: "05 Deportation data", href: deportation-data.html, note: "returns from Europe next to removals from the US."}
citation: "Eurostat, migration and asylum statistics, accessed September 2026. Licence CC BY 4.0. Institute for Mexicans Abroad, consular registration records."
