number: "02"
eyebrow: Europe as destination
title: "Eurostat migration statistics, with the companion sources of the European project"
description: Profile of the Eurostat migration, permit, asylum and enforcement datasets used to measure LAC migrants in Europe.
lead: >-
  Eurostat compiles what 31 national statistical institutes and interior ministries report under the EU migration
  statistics regulation: residents by country of birth and citizenship, residence permits by reason, asylum
  applications and decisions, naturalisations, and enforcement. It is the only source that follows legal pathways
  and status changes, and it is all aggregate: no person-level records.
tags: [aggregate counts, 31 reporting countries, country of birth and citizenship, permits, asylum, enforcement, 1998–2026]
