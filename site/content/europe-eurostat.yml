number: "02"
eyebrow: Europe as a destination
title: "Europe: Eurostat migration statistics"
description: Profile of the Eurostat statistics on migrants, permits, asylum and returns in Europe.
lead: Official counts that about 30 European countries report to Eurostat. It is our only source on legal pathways into Europe.
tags: [official counts, about 30 countries, permits, asylum, returns, 1998–2026]
