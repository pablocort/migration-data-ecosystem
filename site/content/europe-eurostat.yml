blocks:
  - type: profile
    id: profile-eurostat
    name: "Eurostat migration and asylum statistics (the migr_ datasets)"
    summary: >-
      We keep 118 datasets in which LAC citizens or LAC-born people can be identified, downloaded in full through the
      Eurostat dissemination API and stored as tidy tables with every code and label. A small Python client pins each
      dataset to its totals and to the European reporting countries, so a series for any origin is one call.
    rows:
      - ["Producer", "Eurostat, from national statistical institutes and interior ministries under Regulation (EC) 862/2007."]
      - ["Unit of record", "Aggregate counts: persons (population, flows, naturalisations), permits, applications, decisions, enforcement events. No microdata."]
      - ["Geography", "Reporting countries: EU27, EFTA (Switzerland, Iceland, Liechtenstein, Norway), the United Kingdom to 2019, and candidate countries for some series. Origin: every country, by citizenship (most datasets) or country of birth (five datasets)."]
      - ["Time coverage", "Population by country of birth and citizenship 1998–2025; residence permits 2008–2025; asylum 2008–2026; enforcement 2008–2025; citizenship acquisitions 1998–2024."]
      - ["Periodicity", "Annual; asylum applications and pending cases also monthly."]
      - ["Dimensions", "Citizenship or country of birth; age; sex; permit reason (family, education, employment, other) and length; permit type (Blue Card, intra-corporate transfer, study, seasonal work); applicant type (first-time, subsequent); decision; enforcement type (overstay vs illegal entry, return type and destination)."]
      - ["What it does not have", "Socioeconomic detail by origin (the labour-force survey tables cannot single out LAC countries); France and Germany in the born-in population series; the UK after 2019; sub-national geography."]
      - ["Access and licence", "Open data, Creative Commons BY 4.0 with attribution; API and bulk download, revised continuously."]
      - ["What we hold", "118 datasets as tidy parquet (1.2 billion rows, 262 MB), complete and not filtered to any origin, refreshed September 2026; the metadata catalogue and code lists; GISCO boundaries for maps."]
      - ["Existing products", "A book draft on the Mexican diaspora outside the United States (three versions, 142 charts), a Europe-wide series 1998–2025 (stock, immigration, emigration, naturalisations), a source comparison against Gaskin and Abel and UN DESA, and 2024 return tables for Northern Central America."]
  - type: profile
    id: profile-companions
    name: "Companion sources kept in the same project"
    rows:
      - ["IME consular records", "Instituto de los Mexicanos en el Exterior: fact sheets for 159 countries (2025) and an 11-country panel 2018–2025 of registered Mexicans by sex, mean age, children, occupation, civil status, dual nationality and state of origin. Some years repeat the previous year's figures and are flagged."]
      - ["Spain EPA extract (HDMF)", "Person-level microdata of Mexico-born residents 2018–2025 and comparison indicators for natives and all migrants, drawn from the IDB's How do Migrants Fare project. Profiled on page 03."]
      - ["Gaskin and Abel (2025) stocks", "Modelled stock of people born in Mexico in each of 230 destinations, 1990–2024, used to benchmark Eurostat (agreement within 2–3% when the born-in series is used). Profiled on page 04."]
      - ["Validation", "Spain 2024, Mexico-born: Eurostat 79,581, Gaskin and Abel 77,984, UN DESA 77,724. Permit series read 76% lower than any of these because permits are not people."]
  - type: chart
    id: eu_lac_born_2024
  - type: chart
    id: eu_first_permits_reason
  - type: chart
    id: eu_asylum_first_time
  - type: text
    id: questions
    heading: Questions it answers
    bullets:
      - How many people born in, or holding the citizenship of, each LAC country live in each European country, and since when.
      - Through which legal door they arrive: family, study, work or protection, and whether study permits turn into work permits.
      - How many ask for asylum each month, by citizenship, and how their cases are decided (recognition rates, pending stock).
      - How many naturalize, which quietly removes them from every citizenship-based series.
      - Irregular stay (overstay vs illegal entry), orders to leave and returns, by citizenship and destination.
  - type: callouts
    id: traps
    heading: Known traps
    items:
      - {title: "Three definitions of a national", text: "citizen = passport holder; born in = first generation whatever the passport; previous residence = anyone who moved from that country. They answer different questions and give different numbers. Use country of birth for a stable diaspora measure and citizenship for legal-status questions."}
      - {title: "Geo aggregates sit next to countries", text: "EU27_2020 and EA20 are rows in the same column as DE or ES. Summing naively doubles the total; keep two-letter reporting countries only."}
      - {title: "Totals next to components", text: "Every dimension carries TOTAL beside its parts (age, sex, reason). Pick the total or the parts, never both."}
      - {title: "Two age definitions double flows", text: "Immigration, emigration and naturalisation datasets repeat totals under two age definitions (COMPLET and REACH). Pin one."}
      - {title: "Permits are not people", text: "Stocks of valid permits exclude naturalized citizens and EU-citizen family members; first permits count documents, not arrivals. The born-in population series is the right denominator."}
      - {title: "Reporting countries change", text: "First permits were reported by 16 countries in 2010 and 31 in 2025; Germany only from 2019. Trends need a fixed country panel."}
      - {title: "Suppression and revisions", text: "Small counts are rounded (returns data to 5) or suppressed; OBS_FLAG carries confidentiality and break-in-series markers. Figures are revised; note the download date."}
      - {title: "France and Germany are missing by birth", text: "Neither reports population by country of birth, which is why the stock chart on this page understates the LAC-born total in Europe."}
  - type: links
    heading: Pairs well with
    items:
      - {text: "03 Household surveys", href: household-surveys.html, note: "Spain's EPA adds what Eurostat lacks for Spain: employment, education and income of LAC-born residents."}
      - {text: "04 Global estimates", href: global-estimates.html, note: "UN DESA and FLown fill France and Germany and give the share of each diaspora that lives in Europe."}
      - {text: "05 Deportation data", href: deportation-data.html, note: "Eurostat enforcement (orders to leave, returns) is the European counterpart of ICE removals."}
