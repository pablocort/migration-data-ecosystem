number: null
eyebrow: Reading across sources
title: "Concepts: why numbers differ"
description: Why the same migration question returns different numbers from different sources, and how the five source families line up.
lead: Each source counts something different, such as a person born abroad, a passport, a permit or an event. Most gaps between numbers come from that, not from errors.
prev: {href: deportation-data.html, text: "05 Deportation data"}
next: null
blocks:
  - type: table
    heading: Four ways to count a migrant
    lead: What each source counts, and who it leaves out.
    columns: [Concept, What is counted, Used by, Leaves out]
    rows:
      - ["Born abroad", "People born in another country, whatever their passport", "US surveys, household surveys, UN DESA, Eurostat by birth", "Children of migrants born in the destination"]
      - ["Citizenship", "People with a foreign passport", "Eurostat permits and asylum, ICE removals", "Migrants who naturalized"]
      - ["Permit or application", "Documents, not people", "Eurostat permits, TPS and DACA applications", "People without papers. One person can hold several documents."]
      - ["Event", "Something that happened, such as a removal, an arrest or a detention", "Deportation Data Project, Eurostat returns", "Nothing, but events repeat for the same person"]
  - type: table
    heading: Dates and years
    columns: [Convention, Sources, What to watch]
    rows:
      - ["Mid-year", "UN migrant stock", "Figures are for 1 July."]
      - ["1 January", "Annual estimates, Eurostat population", "Below mid-year figures when a group grows fast."]
      - ["Survey period", "US, Spanish and LAC surveys", "Yearly, quarterly or monthly, by survey."]
      - ["US fiscal year", "ICE, USCIS and Border Patrol", "October to September."]
      - ["Reporting countries", "Eurostat", "More countries report over time. Compare the same set."]
  - type: text
    heading: The same number from different sources
    bullets:
      - "People born in Mexico living in the US, 2024: 11.6 million by place of birth and 11.2 million as foreign-born. The gap is people born abroad to US parents."
      - "People born in Mexico living in Spain: about 80,000 in 2024, by Eurostat, the UN and the annual estimates. Only 34,000 Mexicans held a valid permit in 2025."
      - "Migrants living in LAC, 2024: 17.5 million in the UN regional total and 16.6 million in the 26 IDB borrowing countries."
  - type: table
    heading: The five families side by side
    columns: [Family, Unit, How it spots migrants, Places, Years, How often]
    rows:
      - ["01 US surveys", "People", "Country of birth, year of arrival, citizenship", "United States", "1980–2024", "Every year"]
      - ["02 Eurostat", "Counts, permits, applications", "Citizenship or country of birth", "About 30 European countries", "1998–2026", "Every year; asylum every month"]
      - ["03 Household surveys", "People", "Born in another country", "26 LAC countries, Spain and the US", "1986–2025", "Every year or quarter"]
      - ["04 Global estimates", "Migrants, moves, money", "Country of birth or origin", "Every country", "1990–2025", "Every five years or every year"]
      - ["05 Deportation data", "Events and applications", "Citizenship or country of birth", "United States", "2000–2026", "Every day"]
  - type: text
    heading: Reading our charts
    bullets:
      - Each chart fits one screen. Its note says what to keep in mind.
      - Each series keeps its color across the site. Grey is always the rest.
      - Partial periods are hatched. Modelled series say so in the note.
      - Every chart has a table, a CSV file and a PNG.
