blocks:
  - type: profile
    id: profile-acs
    name: American Community Survey and US census (IPUMS USA)
    summary: The largest US household survey. About 3.5 million addresses a year answer questions on birthplace, citizenship, work and income.
    rows:
      - ["What it is", "The US household survey, plus the 1980, 1990 and 2000 censuses, in one series."]
      - ["Who produces it", "US Census Bureau. IPUMS, at the University of Minnesota, harmonizes it."]
      - ["Unit", "People in sampled households. Weights turn the sample into population totals."]
      - ["Coverage", "The United States, 1980–2024. About 1% of the population each year."]
      - ["How often", "Every year since 2001. The 2020 data are experimental."]
      - ["Migration variables", "Country of birth, year of arrival, citizenship, year of naturalization and residence a year ago."]
      - ["Best for", "The size and profile of each diaspora: age, work, income and time in the US."]
      - ["What we have built with it", "Diaspora profiles by country of birth. A study of how the LAC-born population aged from 2014 to 2024."]
      - ["Access", "Free and public, with registration. Cite IPUMS."]
  - type: profile
    id: profile-cps
    name: Current Population Survey (IPUMS CPS)
    summary: A smaller survey. Its yearly supplement asks where each person's parents were born.
    rows:
      - ["What it is", "The US labour force survey and its yearly income supplement."]
      - ["Who produces it", "US Census Bureau and Bureau of Labor Statistics. IPUMS harmonizes it."]
      - ["Unit", "People in sampled households."]
      - ["Coverage", "The United States, 1994–2025."]
      - ["How often", "Every year, in March."]
      - ["Migration variables", "Country of birth, year of arrival, citizenship and the parents' country of birth."]
      - ["Best for", "The second generation: people born in the US to migrant parents."]
      - ["What we have built with it", "Series of first and second generation migrants, for example from Venezuela."]
      - ["Access", "Free and public, with registration. Cite IPUMS."]
  - type: chart
    id: us_stock_by_country
  - type: chart
    id: us_age_pyramid
  - type: text
    id: questions
    heading: Questions it answers
    bullets:
      - How many people from each LAC country live in the US, and how that changed since 1980.
      - How old they are, how long they have been in the US, and whether they naturalized.
      - Where they work and how much they earn, by origin, age and sex.
      - How many children of migrants were born in the US.
  - type: callouts
    id: traps
    heading: Be careful with
    items:
      - {title: "Two definitions of foreign-born", text: "The Census leaves out people born abroad to US-citizen parents. Counts by place of birth include them and run about 4% higher."}
      - {title: "Panama", text: "People born in the former Canal Zone to US parents count as born in Panama. That inflates the Panamanian figure."}
      - {title: "2020", text: "The pandemic cut survey responses in 2020. Treat that year with care."}
      - {title: "Small groups", text: "Small origins have few survey records. Pool years or report margins of error."}
  - type: links
    heading: Pairs well with
    items:
      - {text: "03 Household surveys", href: household-surveys.html, note: "the same definition of migrant, in LAC and Spain."}
      - {text: "04 Global estimates", href: global-estimates.html, note: "the US numbers next to UN and modelled estimates."}
      - {text: "05 Deportation data", href: deportation-data.html, note: "removals count citizenship, not birth. Compare with care."}
citation: "Ruggles, S. et al. IPUMS USA: Version 16.0. Minneapolis, MN: IPUMS, 2025. Flood, S. et al. IPUMS CPS. Minneapolis, MN: IPUMS. US Census Bureau, American Community Survey."
