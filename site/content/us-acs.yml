blocks:
  - type: profile
    id: profile-acs
    name: "IPUMS USA: decennial census and American Community Survey microdata"
    summary: >-
      The ACS is the household survey of the United States: about 3.5 million addresses a year, asked about
      birthplace, citizenship, year of entry, education, work and income. IPUMS harmonizes it with the decennial
      censuses, so one extract spans 1980 to 2024. The Census Bureau publishes the same records as the Public
      Use Microdata Sample (PUMS), reachable through its API; the charts below use that route.
    rows:
      - ["Producer", "US Census Bureau; harmonized and distributed by IPUMS USA (University of Minnesota)."]
      - ["Unit of record", "A person inside a sampled household, with a person weight (PERWT in IPUMS, PWGTP in PUMS). Every figure is weighted."]
      - ["Geography", "United States, national level in our work. State, county and PUMA are available; a separate geographic extract (2000–2024) holds them."]
      - ["Time coverage", "Census 1980, 1990, 2000 (5% samples) and ACS 2001–2024 (1-year, about 1% of the population). Our main extract covers 2014–2024."]
      - ["Periodicity", "Annual. ACS 2020 used experimental weights and is not fully comparable."]
      - ["Sample size", "About 3.2 million persons per ACS year; roughly 250,000 LAC-born records per year, enough for single countries of birth down to about 100,000 people."]
      - ["Migration variables", "Detailed country of birth (BPLD), citizenship status (CITIZEN), year of naturalization (YRNATUR), year of immigration (YRIMMIG), years in the US (YRSUSA1), residence one year ago including abroad (MIGRATE1, MIGPLAC1), ancestry, Hispanic origin, language and English ability."]
      - ["Other variables", "Age, sex, relationship to head, education, school attendance, degree field, employment status, occupation, industry, weeks and hours worked, total, wage and Social Security income, poverty status, household income."]
      - ["What it does not have", "Legal status beyond citizenship; parents' birthplace (use the CPS); remittances (we join central-bank data instead)."]
      - ["Access and licence", "Free, public; registration at usa.ipums.org. The Census API serves the PUMS with a free key. Microdata are never redistributed; aggregates may be published with citation."]
      - ["What we hold", "A 2014–2024 extract with 54 variables (6.8 GB), a 1980–2023 extract, the full ACS 2024, a geographic extract 2000–2024, and a compact PUMS cache of all LAC-born persons 2014–2024 (the input of the charts here)."]
      - ["Existing products", "The 2014–2024 Age Shift deck for 11 countries (US and Spain), an annual diaspora panel 2014–2024, population by country 1980–2024, years-of-residence distributions, a Venezuelan first and second generation series 1980–2025."]
  - type: profile
    id: profile-cps
    name: "IPUMS CPS: Current Population Survey, Annual Social and Economic Supplement"
    summary: >-
      The March supplement of the CPS is smaller than the ACS but asks about the parents' country of birth, which
      makes it the only survey source for the second generation.
    rows:
      - ["Producer", "US Bureau of Labor Statistics and Census Bureau; harmonized by IPUMS CPS."]
      - ["Unit of record", "A person inside a sampled household; ASEC supplement weights."]
      - ["Time coverage", "Country of birth from 1994; our extracts cover 1994–2025 and 2014–2025."]
      - ["Periodicity", "Annual (March)."]
      - ["Sample size", "About 90,000 households; small for origins other than Mexico, so multi-year pooling is usual."]
      - ["Migration variables", "Country of birth (PENATVTY), year of entry in intervals (PEINUSYR), citizenship (PRCITSHP), mother's and father's country of birth (PEMNTVTY, PEFNTVTY)."]
      - ["Strengths", "Second generation; a long annual series; detailed income and programme participation."]
      - ["Caveats", "Year of entry is grouped; sampling error is large for single countries; weights differ from the ACS so levels are not identical."]
  - type: chart
    id: us_stock_by_country
  - type: chart
    id: us_age_pyramid
  - type: text
    id: questions
    heading: Questions it answers
    bullets:
      - How many people born in each LAC country live in the United States, and how that stock changed year by year since 1980.
      - How the diaspora is ageing: age structure, mean age, the shift from the 18–29 to the 60+ group, and how uneven it is across origins (Mexico ages fast, Honduras gets younger).
      - How long people have been in the country (years since arrival), which matters because remittances grow over the first fifteen years abroad.
      - Who naturalized and when; who arrived in the last year (residence one year ago abroad).
      - Employment, occupation, industry, earnings and total income by origin, sex and age, in constant dollars.
      - Children of migrants (second generation) through the CPS parents' birthplace.
  - type: callouts
    id: traps
    heading: Known traps
    items:
      - {title: "Foreign-born is not born-in", text: "Census 'foreign-born' (naturalized or non-citizen) leaves out people born abroad to US-citizen parents. IPUMS birthplace counts include them, so Mexico reads 11.6 million by birthplace and 11.2 million as foreign-born in 2024. Say which one you use."}
      - {title: "Panama is overcounted", text: "The IPUMS birthplace code for Panama includes US citizens born in the Canal Zone. Expect 30–50% more than Census table B05006."}
      - {title: "2020 is experimental", text: "The 2020 ACS 1-year release uses experimental weights because of pandemic non-response. Treat 2020 as a dotted point."}
      - {title: "Two file conventions", text: "Older extracts are pipe-separated with text labels (bpld == 'Mexico'); newer ones use numeric codes (BPLD == 20000). Scripts that mix them need a mapping."}
      - {title: "Not-in-universe codes", text: "INCTOT uses 9999999 for not applicable and INCWAGE uses 999999. Average either without filtering and the means explode."}
      - {title: "Geography needs a merge", text: "The main extract has no state. Merge the geographic extract on year, sample, household serial and person number before mapping."}
      - {title: "Hours worked are missing in the IPUMS extract", text: "The PUMS cache from the Census API fills WKHP (usual hours) for the full-time and part-time split; records and weights match IPUMS one to one."}
      - {title: "A mislabelled Mexico file", text: "One 2024 PUMS download used place-of-birth code 210 (India) instead of 303 (Mexico). Do not reuse the curated Mexico 2024 rows."}
  - type: links
    heading: Pairs well with
    items:
      - {text: "03 Household surveys", href: household-surveys.html, note: "the same concept (born abroad) in the LAC and Spanish surveys; the US row of the employment chart comes from here."}
      - {text: "02 Europe: Eurostat", href: europe-eurostat.html, note: "the Spain side of the Age Shift deck uses the EPA with the same age groups and employment definition."}
      - {text: "05 Deportation data", href: deportation-data.html, note: "removals by citizenship against stocks by birth: the two populations differ, so compare with care."}
      - {text: "04 Global estimates", href: global-estimates.html, note: "UN DESA and FLown put the US stock in a global frame; central-bank remittances are joined to the diaspora panel."}
citation: >-
  Steven Ruggles, Sarah Flood, Matthew Sobek, Daniel Backman, Grace Cooper, Julia A. Rivera Drew, Stephanie
  Richards, Renae Rodgers, Jonathan Schroeder and Kari C.W. Williams. IPUMS USA: Version 16.0 [dataset].
  Minneapolis, MN: IPUMS, 2025. Sarah Flood et al. IPUMS CPS [dataset]. Minneapolis, MN: IPUMS. US Census Bureau,
