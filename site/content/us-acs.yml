number: "01"
eyebrow: The United States as a destination
title: "United States: census and survey data"
description: Profile of the US census and survey data on people born in Latin America and the Caribbean.
lead: Person-level data from the US Census Bureau, harmonized by IPUMS. It is our richest view of the 25.8 million people born in LAC who live in the US.
tags: [person-level, country of birth, year of arrival, citizenship, income, 1980–2024]
