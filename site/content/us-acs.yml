number: "01"
eyebrow: United States as destination
title: "ACS and CPS microdata: IPUMS USA, Census PUMS and IPUMS CPS"
description: Profile of the US census microdata used to measure the LAC-born population in the United States.
lead: >-
  Person-level survey microdata from the US Census Bureau, harmonized and distributed by IPUMS. It is the most
  detailed view we have of the 25.8 million people born in Latin America and the Caribbean who live in the United
  States: who they are, when they arrived, whether they naturalized, what they earn and where they work.
tags: [person-level microdata, country of birth, year of arrival, citizenship, income, annual 2001–2024, decennial 1980–2000]
