blocks:
  - type: text
    heading: One definition, three families
    html: >-
      <p>All three families flag people born in another country. So the same indicators work for migrants and natives.
      The US surveys add the year of arrival. Spain's survey adds years of residence.
      The LAC surveys only say whether a migrant has lived in the country five years or more.</p>
  - type: profile
    id: profile-idb
    name: IDB Harmonized Household Surveys
    summary: National household surveys from 26 countries, put into one common format by the IDB.
    rows:
      - ["What it is", "Labour force and living-standards surveys with the same variables in every country."]
      - ["Who produces it", "National statistical offices. The IDB harmonizes them."]
      - ["Unit", "People in sampled households, with survey weights."]
      - ["Coverage", "26 LAC countries, 1986–2025."]
      - ["How often", "Every year in most countries. Some countries every quarter."]
      - ["Migration variables", "Born in another country. Born in another LAC country. Five years or more in the country."]
      - ["Best for", "Comparing migrants and natives on work, education, income and poverty."]
      - ["What we have built with it", "Regional comparisons of migrants and natives. Country notes on migrant integration."]
      - ["Access", "Each survey year is public or restricted. We share aggregates only."]
  - type: profile
    id: profile-epa
    name: "Spain: Labour Force Survey"
    summary: Spain hosts the largest LAC diaspora in Europe. About 4.4 million people born in LAC lived there in 2024.
    rows:
      - ["What it is", "Spain's quarterly labour force survey."]
      - ["Who produces it", "National Statistics Institute of Spain (INE). Harmonized with the LAC surveys by the IDB."]
      - ["Unit", "People in sampled households, with survey weights."]
      - ["Coverage", "Spain, 2014 and 2018–2025."]
      - ["How often", "Every quarter."]
      - ["Migration variables", "Country of birth, nationality and years living in Spain."]
      - ["Best for", "Work of LAC-born residents in Spain, with the same definitions as the US data."]
      - ["What we have built with it", "A comparison of LAC migrants in Spain and the US by age and employment."]
      - ["Access", "The 2014 file is public. Country of birth for 2018–2025 comes from a special request to INE."]
  - type: profile
    id: profile-us
    name: "United States: American Community Survey and Current Population Survey"
    rows:
      - ["What it is", "The US household surveys. Page 01 profiles them in full."]
      - ["Best for", "The same indicators, by country of birth, age and year of arrival."]
  - type: chart
    id: svy_availability
  - type: chart
    id: svy_employment_migrants_natives
  - type: text
    id: questions
    heading: Questions it answers
    bullets:
      - What share of each country's population was born abroad.
      - Whether migrants work more or less than natives, and in which jobs.
      - How migrants compare with natives on education, income and poverty.
      - The same questions for LAC migrants in Spain and the US.
  - type: callouts
    id: traps
    heading: Be careful with
    items:
      - {title: "Small samples", text: "Where migrants are few, one survey year has few records. Pool years or report margins of error."}
      - {title: "Missing questions", text: "Some surveys do not ask where people were born. Mexico's main income survey is one."}
      - {title: "National definitions", text: "Each country defines employment its own way. Part of any gap between countries is definition."}
      - {title: "Repeated households", text: "Spain's survey visits the same households for six quarters. Margins of error must reflect that."}
  - type: links
    heading: Pairs well with
    items:
      - {text: "01 United States", href: us-acs.html, note: "the US surveys in full."}
      - {text: "02 Europe", href: europe-eurostat.html, note: "official counts for Spain and the rest of Europe."}
      - {text: "04 Global estimates", href: global-estimates.html, note: "totals when a survey misses recent arrivals."}
citation: "Inter-American Development Bank, Harmonized Household Surveys of Latin America and the Caribbean. National Statistics Institute of Spain (INE), Labour Force Survey. IDB, OECD and UNDP (2023), How do migrants fare in Latin America and the Caribbean?"
