number: "03"
eyebrow: Comparable data across destinations
title: "Household surveys: LAC, Spain and the US"
description: Profile of the household surveys that compare migrants and natives with one definition across Latin America and the Caribbean, Spain and the United States.
lead: Three families of surveys share one definition, a person born in another country. So we can compare migrants and natives the same way in Santiago, Madrid and Miami.
tags: [person-level, born abroad, migrants vs natives, 26 LAC countries, Spain, US]
jump:
  - {id: profile-idb, text: LAC surveys}
  - {id: profile-epa, text: Spain}
  - {id: profile-us, text: United States}
