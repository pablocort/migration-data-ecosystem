number: "03"
eyebrow: Comparable microdata across destinations
title: "Household surveys: the IDB harmonized bank, Spain's EPA and the US surveys"
description: Profile of the household-survey microdata that allow migrant-versus-native comparisons with one definition across LAC, Spain and the United States.
lead: >-
  Three families of household surveys share one concept, a person born in another country, and the same way of
  measuring it: an expansion-weighted microdata record with age, sex, education, work and income. That is what
  makes it possible to ask the same question of a Colombian in Santiago, in Madrid and in Miami. This page profiles
  the three families together and sends you to page 01 for the United States in depth.
tags: [person-level microdata, born abroad, migrants vs natives, 26 LAC countries, Spain EPA, US ACS and CPS]
