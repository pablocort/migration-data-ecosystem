number: "04"
eyebrow: Global anchors for stocks, flows, displacement and remittances
title: "UN DESA and global estimates"
description: Profile of the UN DESA migrant stock, the FLown annual bilateral estimates, UNHCR displacement data, UN population prospects and remittance sources.
lead: >-
  The folder we call undesa holds five different products. UN DESA's International Migrant Stock is the official
  anchor; FLown adds an annual, modelled bilateral series; UNHCR adds forced displacement; the World Population
  Prospects give denominators; and the remittance files tie the diaspora to the money it sends home. This page
  classifies them and shows one chart per product.
tags: [bilateral stocks, annual flow estimates, refugees, population, remittances, 1990–2025, country level]
