number: "04"
eyebrow: Global anchors
title: UN DESA and global estimates
description: Profile of the UN migrant stock, annual migration estimates, UNHCR displacement data, population data and remittances.
lead: Five products give the global picture. The UN counts migrants every five years. A model fills the years in between. UNHCR covers displacement. Population and remittance data complete it.
tags: [migrant stocks, annual estimates, refugees, remittances, 1990–2025, every country]
jump:
  - {id: profile-undesa, text: UN migrant stock}
  - {id: profile-model, text: Annual estimates}
  - {id: profile-unhcr, text: UNHCR}
  - {id: profile-remit, text: Remittances}
  - {id: profile-pop, text: Population}
  - {id: traps, text: Be careful with}
prev: {href: household-surveys.html, text: "03 Household surveys"}
next: {href: deportation-data.html, text: "05 Deportation data"}
blocks:
  - type: profile
    id: profile-undesa
    name: UN DESA International Migrant Stock
    summary: The UN estimate of how many migrants live in each country, and where they come from.
    rows:
      - ["What it is", "Official estimates of migrants by country of residence, origin and sex."]
      - ["Who produces it", "UN Department of Economic and Social Affairs, Population Division."]
      - ["Unit", "Migrants living in a country at mid-year."]
      - ["Coverage", "About 230 countries and areas, 1990–2024."]
      - ["How often", "Every five years from 1990 to 2020, then 2024."]
      - ["Migration variables", "Country of birth or citizenship, origin and sex. Age only until 2020."]
      - ["Best for", "The official size of each diaspora and of each country's migrant population."]
      - ["What we have built with it", "Regional briefs on migrant stocks. Country tables by origin and destination."]
      - ["Access", "Free and open. Cite UN DESA."]
  - type: chart
    id: gl_immigrant_stock_lac
  - type: profile
    id: profile-model
    name: Annual migration estimates
    summary: A statistical model turns the UN figures into a yearly series for every pair of countries.
    rows:
      - ["What it is", "Annual estimates of migrants and moves between every pair of countries."]
      - ["Who produces it", "Azose and Raftery (2019), published with Gaskin and Abel (2025)."]
      - ["Unit", "Modelled migrants on 1 January, with uncertainty ranges."]
      - ["Coverage", "Every country, 1990–2024."]
      - ["How often", "Every year."]
      - ["Migration variables", "Country of birth, country of residence and moves by previous residence."]
      - ["Best for", "Year-by-year trends, and where each diaspora lives."]
      - ["What we have built with it", "Studies of migration inside the region. Remittances per migrant."]
      - ["Access", "Free and open. Cite the authors."]
  - type: chart
    id: gl_emigrants_destination
  - type: profile
    id: profile-unhcr
    name: UNHCR Refugee Data Finder
    summary: People forced to leave their homes, by country of origin and country of asylum.
    rows:
      - ["What it is", "Counts of refugees, asylum-seekers and other displaced people."]
      - ["Who produces it", "UN Refugee Agency (UNHCR)."]
      - ["Unit", "People at the end of each year."]
      - ["Coverage", "Every country, 1990–2024."]
      - ["How often", "Every year."]
      - ["Migration variables", "Country of origin, country of asylum and type of protection."]
      - ["Best for", "The size of forced displacement from and within the region."]
      - ["What we have built with it", "Displacement tables for LAC countries as origin and as host."]
      - ["Access", "Free and open. Cite UNHCR."]
  - type: chart
    id: gl_displaced_lac_origin
  - type: profile
    id: profile-remit
    name: Remittances
    summary: Money that migrants send home, from three sources.
    rows:
      - ["What it is", "Yearly totals, flows by sending country, and the cost of sending money."]
      - ["Who produces it", "World Bank and KNOMAD. Central banks of the region. World Bank price survey."]
      - ["Unit", "US dollars and share of GDP."]
      - ["Coverage", "LAC countries, 2000–2025. Flows by sending country for 15 countries."]
      - ["How often", "Every year. Some central banks publish every month."]
      - ["Best for", "How much each country receives, from where, and at what cost."]
      - ["What we have built with it", "Remittances per migrant. The link between diaspora ageing and remittances."]
      - ["Access", "Free and open. Cite each publisher."]
  - type: chart
    id: gl_remittances_gdp
  - type: profile
    id: profile-pop
    name: UN population data
    rows:
      - ["What it is", "UN World Population Prospects: population by age and sex, with projections."]
      - ["Who produces it", "UN Department of Economic and Social Affairs, Population Division."]
      - ["Best for", "Denominators: migrants as a share of the population, and ageing."]
  - type: text
    id: questions
    heading: Questions it answers
    bullets:
      - How many migrants live in each LAC country, and where each diaspora lives.
      - Which migration routes grew in a given year.
      - How large forced displacement is, by origin and host.
      - How much money comes back, from where, and per migrant.
  - type: callouts
    id: traps
    heading: Be careful with
    items:
      - {title: "Different dates", text: "UN figures are for mid-year. The annual estimates are for 1 January. Fast-growing groups differ for that reason."}
      - {title: "Modelled, not counted", text: "Use the annual estimates for trends. Quote the UN for official levels."}
      - {title: "LAC is not the IDB region", text: "The UN region has 33 countries plus territories. The 26 IDB borrowing countries hold 95% of its migrants."}
      - {title: "Displaced Venezuelans", text: "UNHCR counts most displaced Venezuelans as other people in need of protection, not as refugees."}
  - type: links
    heading: Pairs well with
    items:
      - {text: "01 United States", href: us-acs.html, note: "survey counts for the US route."}
      - {text: "02 Europe", href: europe-eurostat.html, note: "for people born in Mexico, Eurostat and the UN agree within 3%."}
      - {text: "05 Deportation data", href: deportation-data.html, note: "removals and returns on the US side."}
citation: "United Nations, DESA, Population Division (2024), International Migrant Stock 2024. Azose, J. and Raftery, A. (2019); Gaskin, T. and Abel, G. (2025), Deep learning four decades of human migration. UNHCR Refugee Data Finder. World Bank and KNOMAD, remittances data. UN DESA, World Population Prospects 2024."
