title: Migration Data Ecosystem
description: A profile of the data sources used to study migration from Latin America and the Caribbean, with one or two charts per source.
eyebrow: Data · Migration · Latin America and the Caribbean
lead: >-
  Five families of sources, one map. This site profiles the datasets behind our migration work, from US census
  microdata to UN stock estimates and immigration-enforcement records, and shows one or two charts per source so
  the team can see what each one can answer, what it cannot, and where it breaks.
buttons:
  - {text: Explore the sources, href: "#sources", kind: btn--primary}
  - {text: How they fit together, href: concepts.html, kind: btn--secondary}
  - {text: Source code, href: "https://github.com/pablocort/migration-data-ecosystem", kind: btn--ghost}
hero_points:
  - A profile per source: producer, unit of record, geography, years, periodicity, migration variables, access and citation, and the traps we have already hit.
  - One or two charts per topic, each with a table view, its CSV and a PNG ready for slides.
  - A concepts page on why the same question returns different numbers from different sources.
stats:
  - {label: Source families, value: "5"}
  - {label: Charts, value: "15"}
  - {label: Years covered, value: "1986–2026"}
  - {label: LAC countries of origin, value: "33"}
sources_heading: What each source gives
sources_lead: >-
  Each profile answers the same questions, in the same order, so sources can be compared at a glance. Numbered
  pages follow the order in which we usually reach for them: destination microdata first, global estimates and
  enforcement records last.
cards:
  - number: "01"
    title: "United States: ACS and CPS microdata"
    blurb: >-
      Person-level census microdata of the 25.8 million LAC-born residents of the United States: country of
      birth, year of arrival, citizenship, income, work. 1980–2024.
    tags: [IPUMS USA, Census PUMS, IPUMS CPS, microdata, annual]
    href: us-acs.html
    accent: "01"
  - number: "02"
    title: "Europe: Eurostat migration statistics"
    blurb: >-
      Aggregate counts for 31 reporting countries: residents by country of birth or citizenship, residence
      permits by reason, asylum, naturalisations and enforcement. 1998–2026.
    tags: [Eurostat, permits, asylum, aggregates, annual and monthly]
    href: europe-eurostat.html
    accent: "02"
  - number: "03"
    title: "Household surveys: LAC, Spain and the US"
    blurb: >-
      Comparable microdata with one concept, born abroad: the IDB harmonized bank for 26 LAC countries, Spain's
      EPA through the HDMF project, and the US surveys of page 01.
    tags: [IDB harmonized surveys, EPA, migrante_ci, migrants vs natives]
    href: household-surveys.html
    accent: "03"
  - number: "04"
    title: "UN DESA and global estimates"
    blurb: >-
      The global anchors: UN DESA migrant stocks, FLown annual bilateral estimates, UNHCR displacement data,
      population prospects and remittances. 1990–2025.
    tags: [UN DESA, FLown, UNHCR, KNOMAD, WPP, bilateral]
    href: global-estimates.html
    accent: "04"
  - number: "05"
    title: "Deportation Data Project"
    blurb: >-
      Record-level US enforcement data released under FOIA: ICE removals, arrests and detentions, USCIS TPS and
      DACA applications, CBP encounters. FY2012–FY2026.
    tags: [ICE, USCIS, CBP, FOIA, record-level, monthly]
    href: deportation-data.html
    accent: "05"
coverage_heading: How far back, and how often
coverage_lead: >-
  Years available per product. Hover a bar for periodicity and unit of record. Microdata and record-level
  sources sit at the top; modelled and aggregate series at the bottom.
map_heading: Sources by geography and type of data
