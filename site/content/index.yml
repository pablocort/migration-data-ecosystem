title: Migration Data Ecosystem
description: A guide to the migration data available to our team today, with one or two charts per source.
eyebrow: A guide to migration data · Latin America and the Caribbean
lead:
  - This guide shows the migration data available to our team today.
  - "We have already built many products with these sources: reports, presentations and analyses for the region."
intro_points:
  - Five families of sources, one page each. Start with the one closest to your question.
  - Each page has a short profile, one or two charts and the main cautions.
  - Every chart has a table, a CSV file and a PNG ready for slides.
buttons:
  - {text: See the sources, href: "#sources", kind: btn--primary}
  - {text: Why numbers differ, href: concepts.html, kind: btn--secondary}
stats:
  - {label: Source families, value: "5"}
  - {label: Years covered, value: "1980–2026"}
  - {label: LAC countries of origin, value: "33"}
  - {label: Charts, value: "15"}
sources_heading: What each source gives
sources_lead: Each profile answers the same questions in the same order. Pick the source that fits your question.
cards:
  - number: "01"
    title: "United States: census and survey data"
    blurb: Person-level data on the 25.8 million people born in Latin America and the Caribbean (LAC) who live in the US.
    tags: [person-level, every year, 1980–2024]
    href: us-acs.html
    accent: "01"
  - number: "02"
    title: "Europe: Eurostat statistics"
    blurb: Official counts from about 30 European countries. Residents by birth and citizenship, permits, asylum and returns.
    tags: [official counts, permits, asylum, 1998–2026]
    href: europe-eurostat.html
    accent: "02"
  - number: "03"
    title: "Household surveys: LAC, Spain and the US"
    blurb: One definition across countries, a person born abroad. Migrants and natives side by side in 26 LAC countries.
    tags: [person-level, migrants vs natives, 1986–2025]
    href: household-surveys.html
    accent: "03"
  - number: "04"
    title: "UN DESA and global estimates"
    blurb: The global anchors. UN migrant stocks, annual estimates, displacement data and remittances.
    tags: [stocks, flows, refugees, remittances]
    href: global-estimates.html
    accent: "04"
  - number: "05"
    title: "Deportation Data Project"
    blurb: Records of US immigration enforcement. ICE removals, arrests and detentions, and TPS and DACA applications.
    tags: [records, removals, TPS and DACA, 2012–2026]
    href: deportation-data.html
    accent: "05"
coverage_heading: How far back each source goes
coverage_lead: US census data go back to 1980. Enforcement records start in 2012.
map_heading: Sources by place and type of data
map_lead: Survey data say who migrants are. Records say what happens to them. Official counts say how many. Estimates fill the gaps.
