number: "05"
eyebrow: US immigration enforcement
title: "Deportation Data Project: ICE and USCIS records"
description: Profile of the US immigration enforcement records released through public records requests and published by the Deportation Data Project.
lead: Records of US immigration enforcement, released through public records requests. Each row is one event, such as a removal, an arrest, a detention or an application.
tags: [records, ICE removals, detentions, TPS and DACA, 2012–2026, every month]
jump:
  - {id: profile-ice, text: ICE records}
  - {id: fig-ddp_removals_fy, text: Removals}
  - {id: fig-ddp_third_country, text: Third countries}
  - {id: profile-uscis, text: TPS and DACA}
  - {id: fig-ddp_tps_backlog, text: TPS backlog}
  - {id: traps, text: Be careful with}
prev: {href: global-estimates.html, text: "04 Global estimates"}
next: {href: concepts.html, text: "Concepts"}
blocks:
  - type: profile
    id: profile-ice
    name: ICE removals, arrests and detentions
    summary: Records of people removed, arrested or detained by US Immigration and Customs Enforcement.
    rows:
      - ["What it is", "One row per removal, arrest or detention, with an anonymous person number."]
      - ["Who produces it", "US Immigration and Customs Enforcement. Published by the Deportation Data Project."]
      - ["Unit", "Events, not people. One person can appear several times."]
      - ["Coverage", "The United States, October 2011 to March 2026."]
      - ["How often", "Daily records, used by month and by fiscal year."]
      - ["Migration variables", "Citizenship, country of birth, entry date, removal country, criminal history and arresting agency."]
      - ["Best for", "Who is removed, how many, and to which country."]
      - ["What we have built with it", "Quarterly reports on removals to the region. Profiles of people removed in 2024 and 2025."]
      - ["Access", "Free and public. Cite the Deportation Data Project."]
  - type: chart
    id: ddp_removals_fy
  - type: chart
    id: ddp_third_country
  - type: profile
    id: profile-uscis
    name: TPS and DACA applications
    summary: Every application to two US protection programs since 2000.
    rows:
      - ["What it is", "Applications for Temporary Protected Status (TPS) and Deferred Action for Childhood Arrivals (DACA)."]
      - ["Who produces it", "US Citizenship and Immigration Services. Published by the Deportation Data Project."]
      - ["Unit", "Applications, not people. Renewals repeat."]
      - ["Coverage", "2000 to February 2026. DACA starts in 2012."]
      - ["How often", "Daily records, used by month."]
      - ["Migration variables", "Country of birth, sex, age group, first application or renewal, and decision."]
      - ["Best for", "How many people apply, how fast cases are decided, and how many wait."]
      - ["What we have built with it", "Monthly series of TPS and DACA. An estimate of Haitians with TPS."]
      - ["Access", "Free and public. Cite the Deportation Data Project."]
  - type: chart
    id: ddp_tps_backlog
  - type: profile
    id: profile-cbp
    name: Border Patrol encounters
    rows:
      - ["What it is", "One row per encounter at the US border."]
      - ["Coverage", "2016–2018 and 2023–2024. The years in between are missing."]
      - ["Best for", "Arrivals at the border by citizenship, in the years we have."]
  - type: text
    id: questions
    heading: Questions it answers
    bullets:
      - How many citizens of each LAC country the US removes each month.
      - "Who is removed: age, sex, time in the US and criminal history."
      - How many are sent to a country that is not their own.
      - How many people wait for a TPS or DACA decision.
  - type: callouts
    id: traps
    heading: Be careful with
    items:
      - {title: "Fiscal years", text: "A US fiscal year runs from October to September. FY2025 began in October 2024."}
      - {title: "Partial year", text: "Records stop in March 2026. The low FY2026 bar is not a drop."}
      - {title: "Expulsions are not removals", text: "Pandemic-era expulsions in 2020–2022 are not in these records. Those years look low for that reason."}
      - {title: "Last entry, not arrival", text: "The entry date is the last recorded entry. It does not show how long someone lived in the US."}
  - type: links
    heading: Pairs well with
    items:
      - {text: "01 United States", href: us-acs.html, note: "removals next to the size of each diaspora."}
      - {text: "02 Europe", href: europe-eurostat.html, note: "returns from Europe."}
      - {text: "04 Global estimates", href: global-estimates.html, note: "remittances to the same countries."}
citation: "Deportation Data Project (deportationdata.org): ICE removals, arrests and detentions; USCIS TPS and DACA applications; Border Patrol encounters. Records obtained under the Freedom of Information Act."
