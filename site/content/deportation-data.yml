number: "05"
eyebrow: US immigration enforcement, record by record
title: "Deportation Data Project: ICE, USCIS and CBP records"
description: Profile of the record-level US immigration enforcement data released under FOIA and compiled by the Deportation Data Project.
lead: >-
  The Deportation Data Project obtains individual-level records from US immigration agencies through Freedom of
  Information Act requests and publishes them with documentation. We hold ICE removals, arrests and detentions
  from fiscal year 2012 to March 2026, every TPS and DACA application since 2000, and partial Border Patrol
  encounter files. It is the only source that sees enforcement one person, one event at a time.
tags: [record-level, FOIA, ICE removals, detentions, USCIS TPS and DACA, CBP encounters, FY2012–FY2026, monthly]
